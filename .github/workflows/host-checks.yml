name: Port checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-boundaries:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [none, asan-ubsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install pinned inventory parser
        run: |
          python3.12 -m venv build-parser
          build-parser/bin/python -m pip install --only-binary=:all: --require-hashes -r tools/parser-requirements.txt
      - name: Host and contract probes
        run: build-parser/bin/python tools/run_host_probes.py --build-dir build-ci-${{ matrix.sanitizer }} --sanitizer ${{ matrix.sanitizer }}
      - name: Whitespace check
        run: git diff-tree --root --check HEAD -- . ':!LICENSE.md'
  arm-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install isolated pinned SDK
        run: |
          python3 tools/install_ci_sdk.py --directory build-sdk-ci
          echo "VITASDK=$GITHUB_WORKSPACE/build-sdk-ci/vitasdk" >> "$GITHUB_ENV"
      - name: Install pinned inventory parser
        run: |
          python3.12 -m venv build-parser
          build-parser/bin/python -m pip install --only-binary=:all: --require-hashes -r tools/parser-requirements.txt
      - name: Compile and link ARM baseline
        run: |
          cmake -S . -B build-arm-ci -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-arm-ci --parallel 2
          python3 tools/record_build_identity.py --build-dir build-arm-ci
      - name: Reproduce original-project inventory
        run: |
          python3 tools/fetch_source_baseline.py --directory build-source-ci
          python3 tools/stage_engine_tree.py --source build-source-ci/GeneralsMD/Code --output build-engine-ci/staged --summary build-engine-ci/engine-stage-baseline.json
          cmp reports/generated/engine-stage-baseline.json build-engine-ci/engine-stage-baseline.json
          python3 tools/audit_original_projects.py --source build-source-ci/GeneralsMD/Code --compile-commands build-arm-ci/compile_commands.json --output build-arm-ci/original-projects.json
          python3 tools/verify_project_inventory.py build-arm-ci/original-projects.json
          python3 tools/audit_module_registrations.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/module-registrations.json
          cmp reports/generated/module-registrations.json build-arm-ci/module-registrations.json
          python3 tools/audit_script_dispatch.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/script-dispatch.json
          cmp reports/generated/script-dispatch.json build-arm-ci/script-dispatch.json
          python3 tools/audit_ini_dispatch.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/ini-dispatch.json
          cmp reports/generated/ini-dispatch.json build-arm-ci/ini-dispatch.json
          python3 tools/audit_renderer_boundary.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/renderer-boundary.json.gz
          python3 tools/compare_report.py reports/generated/renderer-boundary.json.gz build-arm-ci/renderer-boundary.json.gz
          build-parser/bin/python tools/audit_source_structure.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/source-structure.json.gz
          python3 tools/compare_report.py reports/generated/source-structure.json.gz build-arm-ci/source-structure.json.gz
          python3 tools/audit_runtime_providers.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/runtime-providers.json
          cmp reports/generated/runtime-providers.json build-arm-ci/runtime-providers.json
          python3 tools/audit_include_paths.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/include-paths.json.gz
          python3 tools/compare_report.py reports/generated/include-paths.json.gz build-arm-ci/include-paths.json.gz
          build-parser/bin/python tools/audit_system_ownership.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/system-ownership.json.gz
          python3 tools/compare_report.py reports/generated/system-ownership.json.gz build-arm-ci/system-ownership.json.gz
          build-parser/bin/python tools/audit_chunk_routes.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/chunk-routes.json.gz
          python3 tools/compare_report.py reports/generated/chunk-routes.json.gz build-arm-ci/chunk-routes.json.gz
          build-parser/bin/python tools/audit_movie_routes.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/movie-routes.json.gz
          python3 tools/compare_report.py reports/generated/movie-routes.json.gz build-arm-ci/movie-routes.json.gz
          build-parser/bin/python tools/audit_function_lexicon.py --source build-source-ci/GeneralsMD/Code --output build-arm-ci/function-lexicon.json.gz
          python3 tools/compare_report.py reports/generated/function-lexicon.json.gz build-arm-ci/function-lexicon.json.gz
          python3 tools/consolidate_sweep_gaps.py --output build-arm-ci/consolidated-gaps.json --ledger build-arm-ci/PORT_GAPS.md
          cmp reports/generated/consolidated-gaps.json build-arm-ci/consolidated-gaps.json
          cmp docs/PORT_GAPS.md build-arm-ci/PORT_GAPS.md
